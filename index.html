<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Wits — Question Bank</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    />

    <link rel="icon" href="assets/img/logo.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { corePlugins: { preflight: false } };
    </script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <!-- HEADER / CONTROL CONSOLE -->
      <header class="console">
        <div class="console-brand">
          <img class="brand-mark" src="assets/img/logo.jpg" alt="School Wits" />
          <div class="brand-text">
            <span class="brand-name">School Wits</span>
            <span class="brand-sub">Question Bank</span>
          </div>
        </div>

        <div class="console-center">
          <nav class="sitenav" id="siteNav"></nav>
          <nav class="sitenav sitenav--secondary">
            <a href="modules.html">Modules</a><a href="upload.html">Upload</a>
          </nav>

          <div class="searchbar">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#6B7280"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="M21 21l-4.3-4.3" />
            </svg>
            <input type="text" id="fText" placeholder="Search questions…" />
          </div>
        </div>

        <button
          class="sidebar-toggle-btn"
          id="sidebarToggle"
          type="button"
          aria-label="Toggle filters"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
          Filters
        </button>
      </header>

      <!-- ============================================================ BODY -->
      <div class="layout">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar" id="filterMount"></aside>
        <main class="main" id="main"></main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase/config.js"></script>
    <script src="js/supabase/store.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/katex-config.js"></script>
    <script src="js/render/escape.js"></script>
    <script src="js/render/block-renderer.js"></script>
    <script src="js/render/part-renderer.js"></script>
    <script src="js/render/options-renderer.js"></script>
    <script src="js/render/mark-scheme-renderer.js"></script>
    <script src="js/render/solution-renderer.js"></script>
    <script src="js/render/question-renderer.js"></script>
    <script src="js/browse-shell.js"></script>
    <!-- Admin editor. Deliberately NOT loaded by home.html (student portal) -->
    <script src="js/edit/edit-modal.js"></script>
    <script>
      SWShell.mount();
    </script>
    <script src="js/app.js"></script>
  </body>
</html>
