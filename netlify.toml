# Netlify build.
#
# `next build` with output: "export" writes plain static files to out/, so
# there is no serverless runtime to configure and no environment variables
# to set — the publishable Supabase key is committed in config/supabase.ts
# and RLS is the real boundary.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
